<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지금, 이 마음에게</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap');

  :root {
    --ink: #EFEAF6;
    --ink-soft: #C9BFDC;
    --line: rgba(255,255,255,0.22);

    --red: #E07A6C;
    --red-bg: rgba(224,122,108,0.28);
    --yellow: #E8C24E;
    --yellow-bg: rgba(232,194,78,0.28);
    --blue: #7C93D1;
    --blue-bg: rgba(124,147,209,0.28);
    --green: #82B98D;
    --green-bg: rgba(130,185,141,0.28);

    --current: var(--ink);
  }

  * { box-sizing: border-box; }
  html, body { height: auto; }

  body {
    margin: 0;
    color: var(--ink);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 32px 16px 60px;
    position: relative;
    overflow-x: hidden;
    background: radial-gradient(ellipse 90% 60% at 20% 0%, #4B3B73 0%, transparent 55%),
                radial-gradient(ellipse 80% 60% at 85% 15%, #6E4C7E 0%, transparent 55%),
                radial-gradient(ellipse 90% 70% at 50% 100%, #7A5C82 0%, transparent 60%),
                linear-gradient(160deg, #211A3B 0%, #3B2C5C 35%, #5C4270 65%, #7C5470 100%);
    background-attachment: fixed;
  }

  body::before {
    content: "";
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(2px 2px at 12% 22%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1.5px 1.5px at 26% 68%, rgba(255,255,255,0.35), transparent),
      radial-gradient(2px 2px at 41% 12%, rgba(255,255,255,0.45), transparent),
      radial-gradient(1.5px 1.5px at 58% 78%, rgba(255,255,255,0.3), transparent),
      radial-gradient(2px 2px at 73% 34%, rgba(255,255,255,0.45), transparent),
      radial-gradient(1.5px 1.5px at 88% 58%, rgba(255,255,255,0.35), transparent),
      radial-gradient(2px 2px at 95% 88%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1.5px 1.5px at 8% 90%, rgba(255,255,255,0.3), transparent);
    opacity: 0.9;
  }

  body::after {
    content: "";
    position: fixed; top: -10%; left: -10%;
    width: 55vw; height: 55vw; max-width: 620px; max-height: 620px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(232,169,194,0.32) 0%, transparent 70%);
    filter: blur(40px); z-index: 0; pointer-events: none;
  }

  .page {
    width: 100%; max-width: 720px; position: relative; z-index: 1;
  }

  .top-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 22px; }
  header { text-align: left; flex: 1; min-width: 0; }

  h1 {
    font-family: 'Nanum Myeongjo', serif;
    font-weight: 700;
    font-size: 26px;
    line-height: 1.4;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
    color: var(--ink);
    text-shadow: 0 0 24px rgba(198,168,232,0.35);
  }

  header p { font-size: 14.5px; color: var(--ink-soft); margin: 0 0 4px; }
  .source-note { display: block; font-size: 12px; color: var(--ink-soft); opacity: 0.75; margin: 0; }
  .today-note { margin-top: 10px; font-size: 14px; color: var(--ink-soft); }
  .today-note strong { color: var(--ink); font-weight: 700; }

  .header-btns { display: flex; gap: 8px; flex-shrink: 0; }

  .toggle-btn, .refresh-btn {
    appearance: none; flex-shrink: 0;
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    color: var(--ink);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px; font-weight: 700;
    border-radius: 14px; padding: 12px 16px;
    cursor: pointer; white-space: nowrap;
    transition: background 0.2s ease, transform 0.15s ease;
  }
  .refresh-btn { padding: 12px 14px; font-size: 16px; line-height: 1; }
  .toggle-btn:hover, .refresh-btn:hover { background: rgba(255,255,255,0.15); transform: translateY(-1px); }

  .meter-wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; min-width: 0; margin-bottom: 28px; }

  @media (max-width: 560px) {
    .meter-wrap { grid-template-columns: 1fr; gap: 10px; }
    .quadrant[data-q="red"] { order: 0; }
    .quadrant[data-q="yellow"] { order: 1; }
    .quadrant[data-q="blue"] { order: 2; }
    .quadrant[data-q="green"] { order: 3; }
    .quadrant { gap: 5px; padding: 10px; border-radius: 14px; }
    .word-btn { padding: 8px 3px; font-size: 11px; border-radius: 8px; }
    .word-btn .en { font-size: 9px; }
  }

  .quadrant {
    display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px;
    padding: 12px; border-radius: 16px; border: 1px solid var(--line);
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    min-width: 0;
  }

  .quadrant[data-q="red"] { border-color: rgba(224,122,108,0.35); }
  .quadrant[data-q="yellow"] { border-color: rgba(232,194,78,0.35); }
  .quadrant[data-q="blue"] { border-color: rgba(124,147,209,0.35); }
  .quadrant[data-q="green"] { border-color: rgba(130,185,141,0.35); }

  .word-btn {
    appearance: none; border: 1px solid rgba(0,0,0,0.12);
    border-radius: 9px; padding: 7px 3px;
    font-family: 'Noto Sans KR', sans-serif; font-size: 12px; font-weight: 700;
    color: #fff; cursor: pointer; text-align: center; line-height: 1.3;
    transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease;
    min-width: 0;
    overflow-wrap: anywhere;
    word-break: keep-all;
  }

  .word-btn .en {
    display: block; font-size: 9px; font-weight: 500; opacity: 0.85; margin-top: 2px;
    color: rgba(255,255,255,0.9);
    overflow-wrap: anywhere;
    word-break: break-all;
  }
  .word-btn:hover { transform: translateY(-2px); filter: brightness(1.12); }

  /* 원본 무드 미터 사진 속 색감을 살린 행별 색상 (위쪽 = 진한 색, 아래쪽 = 옅은 색) */
  .quadrant[data-q="red"] .word-btn[data-row="0"] { background: #8B2942; }
  .quadrant[data-q="red"] .word-btn[data-row="1"] { background: #A33131; }
  .quadrant[data-q="red"] .word-btn[data-row="2"] { background: #C23B2E; }
  .quadrant[data-q="red"] .word-btn[data-row="3"] { background: #D9622B; }
  .quadrant[data-q="red"] .word-btn[data-row="4"] { background: #E0793B; }

  .quadrant[data-q="yellow"] .word-btn { color: #4A3B10; }
  .quadrant[data-q="yellow"] .word-btn .en { color: rgba(74,59,16,0.75); }
  .quadrant[data-q="yellow"] .word-btn[data-row="0"] { background: #EDE07A; }
  .quadrant[data-q="yellow"] .word-btn[data-row="1"] { background: #EAD35C; }
  .quadrant[data-q="yellow"] .word-btn[data-row="2"] { background: #E6C24A; }
  .quadrant[data-q="yellow"] .word-btn[data-row="3"] { background: #E3B93E; }
  .quadrant[data-q="yellow"] .word-btn[data-row="4"] { background: #DFAA3A; }

  .quadrant[data-q="blue"] .word-btn[data-row="0"] { background: #4E6FA8; }
  .quadrant[data-q="blue"] .word-btn[data-row="1"] { background: #45619C; }
  .quadrant[data-q="blue"] .word-btn[data-row="2"] { background: #3D5490; }
  .quadrant[data-q="blue"] .word-btn[data-row="3"] { background: #354876; }
  .quadrant[data-q="blue"] .word-btn[data-row="4"] { background: #2C3C66; }

  .quadrant[data-q="green"] .word-btn[data-row="0"] { background: #9CB86B; }
  .quadrant[data-q="green"] .word-btn[data-row="1"] { background: #8AB06A; }
  .quadrant[data-q="green"] .word-btn[data-row="2"] { background: #74A66C; }
  .quadrant[data-q="green"] .word-btn[data-row="3"] { background: #5E9A67; }
  .quadrant[data-q="green"] .word-btn[data-row="4"] { background: #4A8C5E; }

  .word-btn.selected {
    outline: 2px solid #fff;
    outline-offset: 1px;
    transform: translateY(-2px) scale(1.04);
    box-shadow: 0 8px 20px -4px rgba(0,0,0,0.5);
    z-index: 1;
  }

  .word-btn:focus-visible, .toggle-btn:focus-visible, .again-btn:focus-visible, .save-btn:focus-visible {
    outline: 2px solid var(--ink); outline-offset: 2px;
  }

  #mainView { display: block; }

  .stage { min-height: 220px; display: flex; align-items: center; }

  .placeholder {
    width: 100%; text-align: center; color: var(--ink-soft); font-size: 16px;
    padding: 46px 20px; border: 1px dashed var(--line); border-radius: 20px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }

  .quote-card {
    width: 100%;
    background: rgba(255,255,255,0.10);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.22);
    border-left: 3px solid var(--current);
    border-radius: 6px 24px 24px 6px;
    padding: 32px 26px;
    opacity: 0; transform: translateY(8px);
    animation: rise 0.6s ease forwards;
    box-shadow: 0 20px 60px -20px rgba(0,0,0,0.45);
  }

  @keyframes rise { to { opacity: 1; transform: translateY(0); } }

  .quote-label { font-size: 14px; font-weight: 700; color: var(--current); margin: 0 0 16px; letter-spacing: 0.02em; }

  .quote-text {
    font-family: 'Nanum Myeongjo', serif;
    font-size: 22px; line-height: 1.7; font-weight: 700;
    color: var(--ink); margin: 0 0 24px; letter-spacing: -0.01em;
    text-shadow: 0 0 20px rgba(0,0,0,0.2);
  }

  .quote-text .hl { color: var(--current); }

  .card-actions { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }

  .again-btn {
    appearance: none; border: none; background: none; color: var(--current);
    font-size: 16px; font-weight: 700; cursor: pointer; padding: 10px 0;
    border-bottom: 1px solid var(--current);
  }
  .again-btn:hover { opacity: 0.75; }

  .save-btn {
    appearance: none; border: 1px solid var(--current); background: transparent; color: var(--current);
    font-size: 15px; font-weight: 700; cursor: pointer; padding: 10px 18px; border-radius: 12px;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .save-btn:hover { background: var(--current); color: #241B3A; }
  .save-msg { font-size: 14px; color: var(--ink-soft); }

  #logView {
    position: fixed;
    inset: 0;
    z-index: 200;
    overflow-y: auto;
    padding: 28px 18px 50px;
    background: radial-gradient(ellipse 90% 60% at 20% 0%, #4B3B73 0%, transparent 55%),
                radial-gradient(ellipse 80% 60% at 85% 15%, #6E4C7E 0%, transparent 55%),
                radial-gradient(ellipse 90% 70% at 50% 100%, #7A5C82 0%, transparent 60%),
                linear-gradient(160deg, #211A3B 0%, #3B2C5C 35%, #5C4270 65%, #7C5470 100%);
  }
  #logView.hidden { display: none; }

  .log-screen-header {
    display: flex; align-items: center; justify-content: space-between;
    max-width: 720px; margin: 0 auto 20px;
  }

  .log-screen-title {
    font-family: 'Nanum Myeongjo', serif; font-weight: 700; font-size: 22px;
    color: var(--ink); margin: 0; text-shadow: 0 0 24px rgba(198,168,232,0.35);
  }

  .close-btn {
    appearance: none; border: 1px solid var(--line);
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    color: var(--ink); font-size: 16px; font-weight: 700;
    border-radius: 12px; width: 40px; height: 40px;
    cursor: pointer; flex-shrink: 0;
    transition: background 0.2s ease, transform 0.15s ease;
  }
  .close-btn:hover { background: rgba(255,255,255,0.15); transform: translateY(-1px); }

  .install-overlay {
    position: fixed; inset: 0; z-index: 300;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    background: rgba(20, 14, 36, 0.6);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .install-overlay.hidden { display: none; }

  .install-modal {
    width: 100%; max-width: 380px;
    background: rgba(45, 35, 66, 0.92);
    border: 1px solid rgba(255,255,255,0.22);
    border-radius: 20px;
    padding: 22px 20px;
    box-shadow: 0 20px 60px -20px rgba(0,0,0,0.6);
  }

  .install-modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }

  .install-modal-title {
    font-family: 'Nanum Myeongjo', serif; font-weight: 700; font-size: 19px;
    color: var(--ink); margin: 0;
  }

  .install-modal-text {
    font-size: 14.5px; line-height: 1.7; color: var(--ink-soft);
    margin: 0; white-space: pre-line;
  }

  .install-modal-text strong { color: var(--ink); }

  .log-panel {
    max-width: 720px; margin: 0 auto;
    background: rgba(255,255,255,0.10);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.22);
    border-radius: 22px; padding: 26px 22px;
    box-shadow: 0 20px 60px -20px rgba(0,0,0,0.45);
  }

  .log-empty { color: var(--ink-soft); font-size: 15px; padding: 20px 0; text-align: center; }

  table.log-table { width: 100%; border-collapse: collapse; }
  .log-table th { text-align: left; font-size: 13px; font-weight: 700; color: var(--ink-soft); padding: 0 8px 12px; border-bottom: 1px solid var(--line); }
  .log-table td { font-size: 14px; padding: 13px 8px; border-bottom: 1px solid rgba(255,255,255,0.12); vertical-align: top; color: var(--ink); }
  .log-table tr:last-child td { border-bottom: none; }
  .log-date { white-space: nowrap; color: var(--ink-soft); font-weight: 500; }
  .mood-chip { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; white-space: nowrap; }
  .chip-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .chip-dot[data-q="red"] { background: var(--red); }
  .chip-dot[data-q="yellow"] { background: var(--yellow); }
  .chip-dot[data-q="blue"] { background: var(--blue); }
  .chip-dot[data-q="green"] { background: var(--green); }
  .log-quote { font-family: 'Nanum Myeongjo', serif; line-height: 1.6; }
  .del-link { appearance: none; border: none; background: none; color: var(--ink-soft); font-size: 13px; cursor: pointer; text-decoration: underline; padding: 0; }
  .del-link:hover { color: var(--ink); }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="page">
  <div class="top-row">
    <header>
      <h1>지금, 어떤 마음이신가요</h1>
      <p>무드 미터의 감정 단어 중에서 오늘의 마음을 골라보세요</p>
      <p class="source-note">출처: 무드 미터(Mood Meter) — &lt;감정의 발견&gt;, 마크 브래킷</p>
      <div class="today-note" id="todayNote"></div>
    </header>
    <div class="header-btns">
      <button class="refresh-btn" id="installBtn" title="홈 화면에 추가" aria-label="홈 화면에 추가">&#8962;</button>
      <button class="refresh-btn" id="refreshBtn" title="새로고침" aria-label="새로고침">&#8635;</button>
      <button class="toggle-btn" id="toggleBtn">기록 보기</button>
    </div>
  </div>

  <div id="mainView">
    <div class="meter-wrap" id="meterWrap">
      <div class="quadrant" data-q="red" id="q-red"></div>
      <div class="quadrant" data-q="yellow" id="q-yellow"></div>
      <div class="quadrant" data-q="blue" id="q-blue"></div>
      <div class="quadrant" data-q="green" id="q-green"></div>
    </div>

    <div class="stage" id="stage">
      <div class="placeholder">감정 단어를 눌러보시면<br>그 마음에게 건네는 문장을 보여드릴게요</div>
    </div>
  </div>

  <div id="logView" class="hidden">
    <div class="log-screen-header">
      <p class="log-screen-title">나의 감정 기록</p>
      <button class="close-btn" id="closeLogBtn" aria-label="닫기">&#10005;</button>
    </div>
    <div class="log-panel">
      <div id="logBody"></div>
    </div>
  </div>

  <div id="installModalOverlay" class="hidden install-overlay">
    <div class="install-modal">
      <div class="install-modal-head">
        <p class="install-modal-title">홈 화면에 추가하기</p>
        <button class="close-btn" id="closeInstallBtn" aria-label="닫기">&#10005;</button>
      </div>
      <p class="install-modal-text" id="installModalText"></p>
    </div>
  </div>
</div>

<script>
  const moodWords = {

      {ko:'격분한', en:'Enraged'}, {ko:'공황에 빠진', en:'Panicked'}, {ko:'스트레스 받는', en:'Stressed'}, {ko:'초조한', en:'Jittery'}, {ko:'충격받은', en:'Shocked'},

      {ko:'화가 치밀어 오르는', en:'Fuming'}, {ko:'겁먹은', en:'Frightened'}, {ko:'화난', en:'Angry'}, {ko:'초조해하는', en:'Nervous'}, {ko:'안절부절못하는', en:'Restless'},
      {ko:'불안한', en:'Anxious'}, {ko:'우려하는', en:'Apprehensive'}, {ko:'근심하는', en:'Worried'}, {ko:'짜증나는', en:'Irritated'}, {ko:'거슬리는', en:'Annoyed'},
      {ko:'불쾌한', en:'Repulsed'}, {ko:'골치 아픈', en:'Troubled'}, {ko:'염려하는', en:'Concerned'}, {ko:'마음이 불편한', en:'Uneasy'}, {ko:'언짢은', en:'Peeved'}

      {ko:'들뜬', en:'Hyper'}, {ko:'쾌활한', en:'Cheerful'}, {ko:'동기 부여된', en:'Motivated'}, {ko:'영감을 받은', en:'Inspired'}, {ko:'의기양양한', en:'Elated'},
      {ko:'기운이 넘치는', en:'Energized'}, {ko:'활발한', en:'Lively'}, {ko:'흥분한', en:'Excited'}, {ko:'낙관적인', en:'Optimistic'}, {ko:'열광하는', en:'Enthusiastic'},
      {ko:'만족스러운', en:'Pleased'}, {ko:'집중하는', en:'Focused'}, {ko:'행복한', en:'Happy'}, {ko:'자랑스러운', en:'Proud'}, {ko:'짜릿한', en:'Thrilled'},

    ],
    blue: [

      {ko:'비관적인', en:'Pessimistic'}, {ko:'시무룩한', en:'Morose'}, {ko:'낙담한', en:'Discouraged'}, {ko:'슬픈', en:'Sad'}, {ko:'지루한', en:'Bored'},
      {ko:'소외된', en:'Alienated'}, {ko:'비참한', en:'Miserable'}, {ko:'쓸쓸한', en:'Lonely'}, {ko:'기죽은', en:'Disheartened'}, {ko:'피곤한', en:'Tired'},
      {ko:'의기소침한', en:'Despondent'}, {ko:'우울한', en:'Depressed'}, {ko:'뚱한', en:'Sullen'}, {ko:'기진맥진한', en:'Exhausted'}, {ko:'지친', en:'Fatigued'},
      {ko:'절망하는', en:'Despairing'}, {ko:'가망 없는', en:'Hopeless'}, {ko:'고독한', en:'Desolate'}, {ko:'소모된', en:'Spent'}, {ko:'진이 빠진', en:'Drained'}
    ],
    green: [

  const quadLabel = { red: "당신에게", yellow: "당신에게", blue: "당신에게", green: "당신에게" };

  let lastIndex = {}; // 단어별 마지막으로 보여준 템플릿 인덱스 (연속 중복 방지)
  let records = {};

  function buildWordGrid() {
    Object.keys(moodWords).forEach(q => {
      const container = document.getElementById('q-' + q);
      container.innerHTML = moodWords[q].map((w, i) => `
        <button class="word-btn" data-q="${q}" data-word="${w.ko}" data-row="${Math.floor(i/5)}">${w.ko}<span class="en">${w.en}</span></button>
      `).join('');
    });
    document.querySelectorAll('.word-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.word-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        render(btn.dataset.q, btn.dataset.word);
        const stageEl = document.getElementById('stage');
        if (stageEl) {
          setTimeout(() => {
            stageEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }, 50);
        }
      });
    });
  }

  function pickQuote(q, word) {
    const list = templates[q];
    const key = word; // 단어별로 마지막 인덱스를 따로 관리
    let idx;
    do { idx = Math.floor(Math.random() * list.length); }
    while (list.length > 1 && idx === lastIndex[key]);
    lastIndex[key] = idx;
    return list[idx].split('{w}').join(word);
  }

  function getTodayKey() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function formatDisplayDate(dateStr) {
    const [y,m,d] = dateStr.split('-').map(Number);
    return new Date(y, m-1, d).toLocaleDateString('ko-KR', { month:'long', day:'numeric', weekday:'short' });
  }

  async function persistRecords() {
    try { await window.storage.set('mood-records', JSON.stringify(records), false); }
    catch (e) { console.error('저장 실패', e); }
  }

  function updateTodayNote() {
    const note = document.getElementById('todayNote');
    const rec = records[getTodayKey()];
    note.innerHTML = rec ? `오늘 기록한 감정: <strong>${rec.word || rec.mood}</strong>` : '';
  }

  function render(q, word) {
    const text = pickQuote(q, word);
    const stage = document.getElementById('stage');
    stage.innerHTML = `
      <div class="quote-card" style="--current:var(--${q});">
        <p class="quote-label">${word} ${quadLabel[q]}</p>
        <p class="quote-text">${text}</p>
        <div class="card-actions">
          <button class="again-btn" id="again">다른 문장 보기</button>
          <button class="save-btn" id="saveBtn">오늘 기록에 저장</button>
          <span class="save-msg" id="saveMsg"></span>
        </div>
      </div>
    `;
    document.getElementById('again').addEventListener('click', () => render(q, word));
    document.getElementById('saveBtn').addEventListener('click', async () => {
      const key = getTodayKey();
      records[key] = { mood: q, word, quoteText: text, savedAt: new Date().toISOString() };
      await persistRecords();
      document.getElementById('saveMsg').textContent = `${formatDisplayDate(key)} 기록에 저장되었어요`;
      updateTodayNote();
    });
  }

  function renderLog() {
    const body = document.getElementById('logBody');
    const keys = Object.keys(records).sort().reverse();
    if (keys.length === 0) {
      body.innerHTML = '<div class="log-empty">아직 기록된 감정이 없어요.<br>감정 단어를 고르고 "오늘 기록에 저장"을 눌러보세요.</div>';
      return;
    }
    let rows = '';
    keys.forEach(key => {
      const rec = records[key];
      const label = rec.word || rec.mood;
      rows += `
        <tr>
          <td class="log-date">${formatDisplayDate(key)}</td>
          <td><span class="mood-chip"><span class="chip-dot" data-q="${rec.mood}"></span>${label}</span></td>
          <td class="log-quote">${rec.quoteText}</td>
          <td><button class="del-link" data-key="${key}">삭제</button></td>
        </tr>
      `;
    });
    body.innerHTML = `<table class="log-table"><thead><tr><th>날짜</th><th>감정</th><th>오늘의 문장</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
    body.querySelectorAll('.del-link').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const key = e.target.getAttribute('data-key');
        delete records[key];
        await persistRecords();
        renderLog();
        updateTodayNote();
      });
    });
  }

  const logView = document.getElementById('logView');
  const closeLogBtn = document.getElementById('closeLogBtn');

  function openLog() {
    logView.classList.remove('hidden');
    renderLog();
    window.scrollTo(0, 0);
  }

  function closeLog() {
    logView.classList.add('hidden');

  toggleBtn.addEventListener('click', openLog);
  closeLogBtn.addEventListener('click', closeLog);

  const installOverlay = document.getElementById('installModalOverlay');
  const installText = document.getElementById('installModalText');
  const closeInstallBtn = document.getElementById('closeInstallBtn');

  let deferredInstallPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
  });

  function getInstallGuideText() {
    const ua = navigator.userAgent;
    const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
    const isAndroid = /Android/.test(ua);

    if (isIOS) {
      return '아이폰(사파리)에서 보고 계시네요.\n\n1. 화면 아래쪽 공유 버튼( ⬆︎ 이 그려진 사각형 아이콘 )을 눌러주세요.\n2. 메뉴를 아래로 내려 "홈 화면에 추가"를 선택해주세요.\n3. 오른쪽 위 "추가"를 누르면 완료돼요.';
    }
    if (isAndroid) {
      return '안드로이드에서 보고 계시네요.\n\n1. 브라우저 오른쪽 위 점 3개(⋮) 메뉴를 눌러주세요.\n2. "홈 화면에 추가" 또는 "앱 설치"를 선택해주세요.\n3. 안내에 따라 추가를 눌러주시면 완료돼요.';
    }
    return '휴대폰 브라우저에서 이 페이지를 열면\n"홈 화면에 추가" 버튼으로 아이콘을 만들 수 있어요.\n\n지금 계신 이 화면(컴퓨터 등)에서는 지원되지 않아요.';
  }

  installBtn.addEventListener('click', async () => {
    if (deferredInstallPrompt) {
      deferredInstallPrompt.prompt();
      try { await deferredInstallPrompt.userChoice; } catch (e) {}
      deferredInstallPrompt = null;
      return;
    }
    installText.textContent = getInstallGuideText();
    installOverlay.classList.remove('hidden');
  });

  closeInstallBtn.addEventListener('click', () => {
    installOverlay.classList.add('hidden');
  });

  installOverlay.addEventListener('click', (e) => {
    if (e.target === installOverlay) installOverlay.classList.add('hidden');
  });

  buildWordGrid();

  (async () => {
    try {
      const res = await window.storage.get('mood-records', false);
      records = res && res.value ? JSON.parse(res.value) : {};
    } catch (e) { records = {}; }
    updateTodayNote();
